  CONFIG.token = localStorage.getItem('ms_token') || '';
  CONFIG.orgId = localStorage.getItem('ms_org_id') || '';
  CONFIG.storeId = localStorage.getItem('ms_store_id') || '';

}

function saveConfig() {

function configComplete() {

/* ===================== ЖУРНАЛ (аналог print() из питон-скрипта) ===================== */

const logEl = document.getElementById('log');
const logCountEl = document.getElementById('logCount');
let logLines = 0;

function log(msg) {
  console.log(msg);
  logLines++;
  logCountEl.textContent = logLines + ' строк';

  let cls = 'l-info';
  if (msg.includes('[OK]')) cls = 'l-ok';
  else if (msg.includes('❗ПРОВЕРЬТЕ ЦЕНУ') || msg.includes('[ПРЕДУПРЕЖДЕНИЕ]') || msg.includes('ПЛАТЁЖ НЕ СОЗДАН')) cls = 'l-warn';
  else if (msg.includes('[!!!]') || msg.includes('ОШИБКА')) cls = 'l-error';
  else if (msg.includes('СКИДКА')) cls = 'l-discount';
  else if (msg.includes('🎁') || msg.includes('ПОДАРОК')) cls = 'l-gift';
  else if (msg.includes('[ПРОПУСК]')) cls = 'l-skip';
  else if (msg.trim().startsWith('=>')) cls = 'l-success';
  else if (!msg.startsWith(' ') && !msg.startsWith('Дата отгрузок')) cls = 'l-header';

  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() {
  logEl.innerHTML = '';
  logLines = 0;
  logCountEl.textContent = 'пусто';

/* ===================== ОКРУГЛЕНИЕ "КАК В PYTHON" (round half to even) ===================== */

function pyRound(x, ndigits) {
  ndigits = ndigits || 0;
  const factor = Math.pow(10, ndigits);
  const scaled = x * factor;
  const floor = Math.floor(scaled);
  const diff = scaled - floor;
  let rounded;
  if (Math.abs(diff - 0.5) < 1e-9) {
    rounded = (floor % 2 === 0) ? floor : floor + 1;
  } else {
    rounded = Math.round(scaled);
  }
  return rounded / factor;
}

let PRODUCTS_CACHE = {};

const DISCOUNT_EXCLUDE_KEYWORDS = []; // ручной список сверх основного правила (по умолчанию пуст)

async function loadProducts() {
  log('Загружаю базу товаров из МоегоСклада...');
  const resp = await fetch(apiUrl('/entity/product?limit=1000'), { headers: msHeaders() });
  if (!resp.ok) {
    log(`  [ОШИБКА API] Не удалось загрузить товары (код ${resp.status}): ${await resp.text()}`);
    throw new Error('load_products failed');
  }
  const data = await resp.json();
  PRODUCTS_CACHE = {};
  for (const item of (data.rows || [])) {
    const fullName = (item.name || '').trim();
    const salePrices = item.salePrices || [];
    const price = salePrices.length ? salePrices[0].value : 0;
    const buyPrice = (item.buyPrice && item.buyPrice.value) || 0;
    PRODUCTS_CACHE[fullName] = { meta: item.meta, price: price, buy_price: buyPrice };
  }
  log(`Загружено ${Object.keys(PRODUCTS_CACHE).length} товаров.`);
  for (const n in PRODUCTS_CACHE) {
    if (n.toLowerCase().includes('хамон')) log(`Найден в базе: '${n}'`);

}

function findProductMeta(pRaw, weight) {
  let query = pRaw.toLowerCase().trim();

  if (query.includes('фуагра') && query.includes('150')) {
    query = 'фуагра ассорти 150гр';
  } else if (query.includes('фуагра') && (query.includes('130') || query.includes('130g'))) {
    query = 'фуагра ассорти 130гр';
  } else if (query.includes('бриет') || query.includes('briette')) {
    query = 'бриет briette (асс.) 125гр';
  }

  const queryClean = query.replace(/ä/g, 'a');

  for (const key in MANUAL_MAP) {
    if (queryClean.includes(key)) {
      const correctName = MANUAL_MAP[key];
      const correctNameClean = correctName.toLowerCase().replace(/ä/g, 'a');
      for (const fullName in PRODUCTS_CACHE) {
        const data = PRODUCTS_CACHE[fullName];
        const msNameClean = fullName.trim().toLowerCase().replace(/ä/g, 'a');
        if (msNameClean === correctNameClean) {
          return { name: fullName, meta: data.meta, price: data.price, buy_price: data.buy_price || 0 };
        }
      }
      log(`  [DEBUG] ВНИМАНИЕ: Словарь понял, что это '${correctName}', но не нашел точно такого названия в МС!`);
    }
  }

  const queryWords = query.split(/[^а-яa-z0-9]/).filter(w => w.length >= 3);

  for (const fullName in PRODUCTS_CACHE) {
    const data = PRODUCTS_CACHE[fullName];
    const nameLower = fullName.toLowerCase();
    const matches = queryWords.filter(w => nameLower.includes(w)).length;
    const isHamon = query.includes('хамон');
    const threshold = isHamon ? 1.0 : 0.67;

    if (queryWords.length > 0 && (matches / queryWords.length >= threshold)) {
      if (weight && weight >= 0.4 && weight <= 0.6 && nameLower.includes('250') && !nameLower.includes('500')) continue;
      if (weight && weight >= 0.2 && weight <= 0.3 && nameLower.includes('500') && !nameLower.includes('250')) continue;
      if (query.includes('родригес') && !nameLower.includes('родригес')) continue;

      return { name: fullName, meta: data.meta, price: data.price, buy_price: data.buy_price };
    }
  }

  return null;
}

/* ===================== СКИДКИ ===================== */

function detectDiscountPercent(blockText) {
  const textLower = blockText.toLowerCase();

  let m = textLower.match(/(\d{1,2})\s*%\s*ск/);
  if (m) return parseInt(m[1], 10);

  m = textLower.match(/-\s*(\d{1,2})\s*%/);
  if (m) return parseInt(m[1], 10);

  m = textLower.match(/\b\d{3,6}\s*\*\s*0[.,](\d{1,2})\b/);
  if (m) {
    const fracValue = parseFloat('0.' + m[1]);
    return Math.round((1 - fracValue) * 100);
  }
  return null;
}

function isDiscountExcluded(item) {
  const nameLower = (item._name || '').toLowerCase();
  if (DISCOUNT_EXCLUDE_KEYWORDS.some(kw => nameLower.includes(kw))) return true;

  const catalogPrice = item._catalog_price;
  if (catalogPrice) {
    const tolerance = Math.max(100, catalogPrice * 0.01);
    if ((catalogPrice - item.price) > tolerance) return true;
  }
  return false;
}

/* ===================== ЦЕНА ИЗ ТЕКСТА ОТЧЁТА ===================== */

function extractTextPrice(content) {
  let priceRub = null;

  let m = content.match(/\*\s*(\d+(?:[.,]\d+)?)\s*(?:₽|[Рр])\s*\/\s*100\s*г/);
  if (m) {
    priceRub = parseFloat(m[1].replace(',', '.')) * 10;
  } else {
    m = content.match(/(\d+(?:[.,]\d+)?)\s*(?:₽|руб)\s*\*\s*\d+/);
    if (m) {
      priceRub = parseFloat(m[1].replace(',', '.'));
    } else {
      m = content.match(/\*\s*(\d+(?:[.,]\d+)?)\s*(?:₽|руб)(?!\s*\/\s*100)/);
      if (m) {
        priceRub = parseFloat(m[1].replace(',', '.'));
      } else {
        m = content.match(/[-–—]\s*(\d+(?:[.,]\d+)?)\s*(?:₽|руб)\s*(?:\(.*\))?\s*$/);
        if (m) priceRub = parseFloat(m[1].replace(',', '.'));
      }
    }
  }

  if (priceRub === null) return null;
  return pyRound(priceRub * 100);
}

function reportPriceMismatch(productName, textPriceKop, catalogPriceKop) {
  const tolerance = Math.max(100, catalogPriceKop * 0.01);
  if (Math.abs(textPriceKop - catalogPriceKop) > tolerance) {
    const diffRub = (textPriceKop - catalogPriceKop) / 100;
    const sign = diffRub >= 0 ? '+' : '';
    log(`  [❗ПРОВЕРЬТЕ ЦЕНУ] '${productName}': в отчёте ${(textPriceKop / 100).toFixed(2)} ₽, в МоемСкладе ${(catalogPriceKop / 100).toFixed(2)} ₽ ` +
        `(разница ${sign}${diffRub.toFixed(2)} ₽). В документ поставлена цена ИЗ ОТЧЁТА — ` +
        `проверьте, не ошибся ли менеджер или не занизил цену.`);
  }
}

/* ===================== ТЕЛЕФОН / КОНТРАГЕНТ ===================== */

function findPhone(text) {
  const match = text.match(/(?:\+7|8)(?:[\s\-\(\)‑–—]*\d){10}/);
  if (match) {
    let cleanPhone = match[0].replace(/\D/g, '');
    if (cleanPhone.startsWith('8')) cleanPhone = '7' + cleanPhone.slice(1);
    return '+' + cleanPhone;
  }
  return '';
}

async function getOrCreateCounterparty(name, phone) {
  const cleanPhone = phone ? phone.replace(/\D/g, '') : '';

  if (cleanPhone && cleanPhone.length >= 10) {
    const searchPhone = cleanPhone.slice(-10);
    const resp = await fetch(apiUrl('/entity/counterparty?search=' + encodeURIComponent(searchPhone)), { headers: msHeaders() });
    if (resp.ok) {
      const data = await resp.json();
      const rows = data.rows || [];
      if (rows.length) {
        log(`  [Контрагент] Найден по ТЕЛЕФОНУ: ${rows[0].name} (ID: ${rows[0].id})`);
        return rows[0].id;
      }
    }
  }

  let resp = await fetch(apiUrl('/entity/counterparty?search=' + encodeURIComponent(name)), { headers: msHeaders() });
  if (resp.ok) {
    const data = await resp.json();
    for (const row of (data.rows || [])) {
      if (row.name.toLowerCase() === name.toLowerCase()) {
        log(`  [Контрагент] Найден по точному ИМЕНИ: ${row.name}`);
        return row.id;
      }
    }
  }

  const newCp = { name: name };
  if (phone) newCp.phone = phone;

  resp = await fetch(apiUrl('/entity/counterparty'), { method: 'POST', headers: msHeaders(), body: JSON.stringify(newCp) });
  if (resp.status === 200 || resp.status === 201) {
    const data = await resp.json();
    log(`  [Контрагент] СОЗДАН НОВЫЙ: ${name} (Телефон: ${phone})`);
    return data.id;
  } else {
    log(`  [ОШИБКА API] Не удалось создать контрагента '${name}'. ${await resp.text()}`);
    return null;
  }
}

async function demandAlreadyExists(cId, dateStr, descText) {
  const params = `moment>=${dateStr} 00:00:00;moment<=${dateStr} 23:59:59`;
  const resp = await fetch(apiUrl('/entity/demand?filter=' + encodeURIComponent(params) + '&limit=100'), { headers: msHeaders() });
  if (!resp.ok) {
    log(`  [ПРЕДУПРЕЖДЕНИЕ] Не удалось проверить дубликаты отгрузок (код ${resp.status}). Продолжаю без проверки.`);
    return false;
  }
  const data = await resp.json();
  const descNorm = descText.trim();
  for (const row of (data.rows || [])) {
    const agentHref = (row.agent && row.agent.meta && row.agent.meta.href) || '';
    if (agentHref.endsWith('/counterparty/' + cId) && (row.description || '').trim() === descNorm) return true;
  }
  return false;
}

}

/* ===================== ИТОГО ИЗ ТЕКСТА ЗАКАЗА ===================== */

function extractReportTotalKopecks(blockText) {
  // Приоритет: строка "Суммарный итог" — она встречается, когда один клиент
  // фактически сделал НЕСКОЛЬКО под-заказов под одним заголовком (каждый со своим
  // "Итого:"), и в конце менеджер подводит ОБЩИЙ итог. Если её нет — берём первую
  // обычную строку "Итого:" (как раньше).
  let m = blockText.match(/суммарный\s+итог[а-яё]*\s*:?\s*(.+)/i);
  if (!m) {
    m = blockText.match(/итого\s*:?\s*(.+)/i);
  }
  if (!m) return null;
  const tail = m[1];
  const nums = tail.match(/\d+(?:[.,]\d+)?/g);
  if (!nums || !nums.length) return null;
  const itogoRub = parseFloat(nums[nums.length - 1].replace(',', '.'));

  let deliveryRub = 0.0;
  // ВАЖНО: \w в JS матчит только [A-Za-z0-9_] (в отличие от Python, где \w матчит
  // и кириллицу). Поэтому здесь нужен явный класс кириллических букв, иначе
  // "доставка"/"доставки" не находится и доставка не вычитается из "Итого".
  const dm = blockText.match(/доставк[а-яё]*\s*:?\s*(\d+(?:[.,]\d+)?)/i);
  if (dm) deliveryRub = parseFloat(dm[1].replace(',', '.'));

  let junkRub = 0.0;
  const junkRegex = /(?:аккумулятор|термопакет)[^\n=]*=\s*(\d+(?:[.,]\d+)?)/gi;
  let jm;
  while ((jm = junkRegex.exec(blockText)) !== null) {
    junkRub += parseFloat(jm[1].replace(',', '.'));
  }

  const goodsRub = itogoRub - deliveryRub - junkRub;
  return pyRound(goodsRub * 100);
}

/* ===================== СОЗДАНИЕ ДОКУМЕНТОВ ===================== */

function stripInternalFields(items) {
  return items.map(it => {
    const out = {};
    for (const k in it) if (!k.startsWith('_')) out[k] = it[k];
    return out;
  });
}

async function createDemand(cId, items, dateStr, descText) {
  const payload = {
    organization: { meta: { href: `${MS_BASE}/entity/organization/${CONFIG.orgId}`, type: 'organization' } },
    agent: { meta: { href: `${MS_BASE}/entity/counterparty/${cId}`, type: 'counterparty' } },
    store: { meta: { href: `${MS_BASE}/entity/store/${CONFIG.storeId}`, type: 'store' } },
    moment: `${dateStr} 12:00:00`,
    description: descText,
    positions: stripInternalFields(items),
  };
  const resp = await fetch(apiUrl('/entity/demand'), { method: 'POST', headers: msHeaders(), body: JSON.stringify(payload) });
  if (resp.status === 200 || resp.status === 201) return await resp.json();
  log(`  !!! ОШИБКА МС (Код ${resp.status}): ${await resp.text()}`);
  return null;
}

async function createPaymentIn(cId, demandMeta, amountKopecks, dateStr, descText) {
  const payload = {
    organization: { meta: { href: `${MS_BASE}/entity/organization/${CONFIG.orgId}`, type: 'organization' } },
    agent: { meta: { href: `${MS_BASE}/entity/counterparty/${cId}`, type: 'counterparty' } },
    sum: amountKopecks,
    moment: `${dateStr} 12:00:00`,
    description: descText,
    operations: [{ meta: demandMeta, linkedSum: amountKopecks }],
  };
  const resp = await fetch(apiUrl('/entity/paymentin'), { method: 'POST', headers: msHeaders(), body: JSON.stringify(payload) });
  if (resp.status === 200 || resp.status === 201) return true;
  log(`  !!! ОШИБКА СОЗДАНИЯ ПЛАТЕЖА (Код ${resp.status}): ${await resp.text()}`);
  return false;
}

async function createLoss(items, dateStr, descText) {
  const payload = {
    organization: { meta: { href: `${MS_BASE}/entity/organization/${CONFIG.orgId}`, type: 'organization' } },

  return false;
}

/* ===================== ГЛАВНАЯ ОБРАБОТКА ОТЧЁТА ===================== */

async function processReport(reportText) {
  const dateMatch = reportText.match(/(\d{1,2})\.(\d{2})/);
  let reportDate;
  if (dateMatch) {
    const day = dateMatch[1].padStart(2, '0');
    const month = dateMatch[2];
    const year = new Date().getFullYear(); // берём текущий год динамически (в питон-версии год был захардкожен)
    reportDate = `${year}-${month}-${day}`;
  } else {
    reportDate = new Date().toISOString().slice(0, 10);
  }

  const ordersRaw = reportText.split(/(?:\n|^)\s*(\d+\.\s*(?:НЕ\s*)?О[Р]?ПЛАЧЕН[^\n]*|0\.\d+\s+|\d+\.\s*(?=[Гг]риша))/);
  const orders = [];
  for (let i = 1; i < ordersRaw.length; i += 2) {
    const header = (ordersRaw[i] || '').trim();
    const body = (ordersRaw[i + 1] || '').trim();
    orders.push([header, body]);
  }

  log(`Дата отгрузок: ${reportDate}. Найдено заказов: ${orders.length}`);

  for (const [header, block] of orders) {
    const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l);
    if (!lines.length) continue;

    let name;
    if (/^\d+[)\.]\s+/.test(lines[0]) ||
        (/\d+\s*(?:₽|руб)/.test(lines[0]) && !['итого', 'доставка'].some(x => lines[0].toLowerCase().includes(x)))) {
      name = 'Без имени';
    } else {
      name = lines[0];
    }

    let itemsSell = [];
    let itemsLoss = [];
    let lastItem = null;

    for (const line of lines) {
      const lineLower = line.toLowerCase();
      const isItem = /^\d+[)\.]\s+/.test(line) || (
        /(\d+\s*(?:₽|руб)|\s+[-–—]\s*\d+\s*$|🎁|подарок|презент|\s+[-–—=]\s*0\s*(?:₽|руб)?\s*$)/.test(line) &&
        !['итого', 'доставк', 'скидка', 'выручка', 'оплат'].some(x => lineLower.includes(x))
      );

      if (!isItem) continue;

      let content = line.replace(/^\d+[)\.]\s*/, '').trim();

      const bracketMatch = content.match(/\(([ \d.+]+)\)/);
      let weight;
      if (bracketMatch && /\d+\.\d+/.test(bracketMatch[1])) {
        const weights = bracketMatch[1].match(/\d+\.\d+/g) || [];
        weight = weights.length ? pyRound(weights.reduce((s, w) => s + parseFloat(w), 0), 3) : 1.0;
      } else {
        const mEq = content.match(/\*\s*(\d+(?:\.\d+)?)\s*(?:=|$)/);
        if (mEq) {
          weight = parseFloat(mEq[1]);
        } else {
          const mPieces = content.match(/(\d+(?:\.\d+)?)\s*\*\s*\d+\s*(?:₽|руб)?/);
          weight = mPieces ? parseFloat(mPieces[1]) : 1.0;
        }
      }

      const splitRegex = /[-–—]\s*\d|\(\s*\d+\.\d+|\s\d+\s*\*\s*\d+(?:₽|руб)?|\s\d+\s*(?:₽|руб)/;
      let pRaw = content.split(splitRegex)[0].trim();

      const pRawLetters = pRaw.replace(/[^а-яА-Яa-zA-Z]/g, '');
      if (!pRawLetters && content.includes('*') && lastItem !== null) {
        const oldQty = lastItem.quantity;
        lastItem.quantity = weight;
        let priceNote = '';
        const contPrice = extractTextPrice(content);
        if (contPrice !== null) {
          const catalogPrice = lastItem._catalog_price !== undefined ? lastItem._catalog_price : contPrice;
          reportPriceMismatch(lastItem._name || '?', contPrice, catalogPrice);
          lastItem.price = contPrice;
          priceNote = `, цена -> ${(contPrice / 100).toFixed(2)} ₽`;
        }
        log(`  [ДОПИСАНО КОЛ-ВО] Строка '${line}' — это продолжение предыдущей позиции. Кол-во исправлено: ${oldQty} -> ${weight}${priceNote}`);
        continue;
      }

      if (['аккумулятор', 'термопакет', 'доставк', 'комиссия', 'купон', 'отправка', 'пакет'].some(x => lineLower.includes(x))) continue;

      const justLetters = lineLower.replace(/[^а-яa-z]/g, '');
      if (['сырныйпрезент', 'подарок', 'подароккзаказу'].includes(justLetters)) continue;

      const isGift = /🎁|подарок|презент/.test(lineLower) || /[-–—=]\s*0\s*(?:₽|руб)?\s*$/.test(lineLower);

      pRaw = pRaw.replace(/(подарок к заказу|подарок|сырный презент|🎁|\(?не режем\)?)/gi, '').trim();
      pRaw = pRaw.replace(/[-–—]\s*$/, '').trim();

      if (!pRaw) continue;

      const productData = findProductMeta(pRaw, weight);
      if (!productData) {
        log(`  [!!!] ВНИМАНИЕ: Товар '${pRaw}' не найден!`);
        continue;
      }

      if (isGift) {
        log(`  [🎁 ПОДАРОК] Товар '${pRaw}' (Кол-во: ${weight}) -> В СПИСАНИЕ`);
        const newItem = { quantity: weight, assortment: { meta: productData.meta }, price: productData.buy_price, _name: productData.name };
        itemsLoss.push(newItem);
        lastItem = newItem;
      } else {
        let sellPrice = productData.price;
        const textPrice = extractTextPrice(content);
        if (textPrice !== null) {
          reportPriceMismatch(productData.name, textPrice, productData.price);
          sellPrice = textPrice;
        }
        log(`  [OK] Товар '${pRaw}' найден как '${productData.name}' (Кол-во: ${weight}, Цена: ${(sellPrice / 100).toFixed(2)} ₽)`);
        const newItem = { quantity: weight, assortment: { meta: productData.meta }, price: sellPrice, _name: productData.name, _catalog_price: productData.price };
        itemsSell.push(newItem);
        lastItem = newItem;
      }
    }

    // --- УМНОЕ СПАСЕНИЕ ---
    if (!itemsSell.length && !itemsLoss.length) {
      for (const line of lines.slice(1)) {
        const lineLower = line.toLowerCase();
        if (['итого', 'доставка', 'скидка', 'выручка', 'свз', 'сдэк', 'оплат'].some(x => lineLower.includes(x))) continue;

        const productData = findProductMeta(line, 1.0);
        if (productData) {
          let fallbackPrice = productData.price;
          const textPrice = extractTextPrice(line);
          if (textPrice !== null) {
            reportPriceMismatch(productData.name, textPrice, productData.price);
            fallbackPrice = textPrice;
          }
          log(`  [SMART FALLBACK] Скрытый товар спасен: '${line}' -> '${productData.name}' (Цена: ${(fallbackPrice / 100).toFixed(2)} ₽)`);
          itemsSell.push({ quantity: 1.0, assortment: { meta: productData.meta }, price: fallbackPrice, _name: productData.name, _catalog_price: productData.price });
        }
      }
    }

    // --- АВТОСКИДКА ---
    if (itemsSell.length) {
      const discountPercent = detectDiscountPercent(block);
      if (discountPercent) {
        const discounted = [];
        const excluded = [];
        for (const it of itemsSell) {
          if (isDiscountExcluded(it)) {
            excluded.push(it._name);
          } else {
            it.discount = discountPercent;
            discounted.push(it._name);
          }
        }
        if (discounted.length) log(`  [СКИДКА ${discountPercent}%] Применена к: ${discounted.join(', ')}`);
        if (excluded.length) log(`  [СКИДКА ${discountPercent}%] НЕ применена (в списке исключений) к: ${excluded.join(', ')}`);
      }
    }

    // --- ОТГРУЗКА ---
    if (!itemsSell.length) {
      log(`  [ПРОПУСК] В заказе [${header}] (${name}) не найдено товаров. Отгрузка не создана.`);
    } else if (header.toUpperCase().includes('НЕ ОПЛАЧЕН')) {
      log(`  [ПРОПУСК] Заказ [${header}] (${name}) НЕ ОПЛАЧЕН. Отгрузка отменена.`);
    } else {
      const fullDesc = `${header}\n${block.trim()}`;
      const cId = await getOrCreateCounterparty(name, findPhone(block));
      if (cId) {
        if (await demandAlreadyExists(cId, reportDate, fullDesc)) {
          log(`  [ПРОПУСК] Отгрузка [${header}] (${name}) уже есть в МоемСкладе (похоже, отчёт уже обрабатывался) — дубль не создаю.`);
        } else {
          const demandResult = await createDemand(cId, itemsSell, reportDate, fullDesc);
          if (demandResult) {
            log(`  => Отгрузка [${header}] (${name}) успешно создана!`);

            const calculatedKop = itemsSell.reduce((s, it) => s + it.quantity * it.price * (1 - (it.discount || 0) / 100), 0);
            const reportKop = extractReportTotalKopecks(block);
            if (reportKop === null) {
              log(`  [ПЛАТЁЖ] В заказе не нашлась строка 'Итого' для сверки — платёж не создаю, проведите вручную.`);
            } else {
              const toleranceKop = Math.max(200, calculatedKop * 0.001);
              const diffKop = calculatedKop - reportKop;
              if (Math.abs(diffKop) <= toleranceKop) {
                const paymentDesc = fullDesc;
                const paymentSum = demandResult.sum !== undefined ? demandResult.sum : pyRound(calculatedKop);
                if (await paymentAlreadyExists(cId, reportDate, paymentDesc)) {
                  log(`  [ПРОПУСК] Входящий платёж для [${header}] (${name}) уже есть в МоемСкладе — дубль не создаю.`);
                } else if (await createPaymentIn(cId, demandResult.meta, paymentSum, reportDate, paymentDesc)) {
                  log(`  => 💰 Входящий платёж на ${(paymentSum / 100).toFixed(2)} ₽ для [${header}] (${name}) создан (сумма позиций совпала с отчётом).`);
                } else {
                  log(`  [ОШИБКА API] МойСклад не смог создать платёж для '${name}'.`);
                }
              } else {
                const sign = diffKop >= 0 ? '+' : '';
                log(`  [ПЛАТЁЖ НЕ СОЗДАН] Сумма по позициям (${(calculatedKop / 100).toFixed(2)} ₽) не совпала с 'Итого' в отчёте ` +
                    `за вычетом доставки/мусора (${(reportKop / 100).toFixed(2)} ₽, разница ${sign}${(diffKop / 100).toFixed(2)} ₽). ` +
                    `Проверьте заказ [${header}] (${name}) и проведите оплату вручную.`);
              }
            }
          } else {
            log(`  [ОШИБКА API] МойСклад не смог создать отгрузку для '${name}'.`);
          }
        }
      }
    }

    // --- СПИСАНИЕ ПОДАРКОВ ---
    if (itemsLoss.length) {
      const fullDesc = `${header}\n${block.trim()}`;
      const fullLossDesc = `🎁 Списание подарков по заказу:\n${fullDesc}`;
      if (await lossAlreadyExists(reportDate, fullLossDesc)) {
        log(`  [ПРОПУСК] Списание подарков для [${header}] (${name}) уже есть в МоемСкладе — дубль не создаю.`);
      } else if (await createLoss(itemsLoss, reportDate, fullDesc)) {
        log(`  => 🎁 Списание подарков для [${header}] (${name}) успешно создано!`);
      } else {
        log(`  [ОШИБКА API] МойСклад не смог создать списание подарков для '${name}'.`);
      }
    }
  }

  log('Готово.');
}

/* ===================== UI ===================== */

const statusEl = document.getElementById('status');
const processBtn = document.getElementById('processBtn');
const settingsStatusEl = document.getElementById('settingsStatus');

document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  saveConfig();
  settingsStatusEl.textContent = '✓ Сохранено на этом устройстве.';
  setTimeout(() => { settingsStatusEl.textContent = ''; }, 3000);
});

document.getElementById('testConnBtn').addEventListener('click', async () => {
  saveConfig();
  if (!CONFIG.workerUrl || !CONFIG.token) {
    settingsStatusEl.textContent = '✗ Укажи адрес прокси и токен.';
    return;
  }
  settingsStatusEl.textContent = 'Проверяю...';
  try {
    const resp = await fetch(apiUrl('/entity/product?limit=1'), { headers: msHeaders() });
    if (resp.ok) {
      const data = await resp.json();
      const total = data.meta ? data.meta.size : '?';
      settingsStatusEl.textContent = `✓ Связь есть! Товаров в базе: ${total}.`;
    } else {
      const text = await resp.text();
      settingsStatusEl.textContent = `✗ Прокси ответил, но МойСклад вернул ошибку ${resp.status}: ${text.slice(0, 150)}`;
    }
  } catch (err) {
    settingsStatusEl.textContent = `✗ Не удалось достучаться до прокси: ${err.message}`;
  }
});

document.getElementById('clearLogBtn').addEventListener('click', clearLog);

document.getElementById('copyLogBtn').addEventListener('click', async () => {
  const text = Array.from(logEl.children).map(el => el.textContent).join('\n') || logEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = 'Журнал скопирован в буфер обмена.';
  } catch (e) {
    statusEl.textContent = 'Не удалось скопировать автоматически — выдели текст вручную.';
  }
});

processBtn.addEventListener('click', async () => {
  loadConfig();
  if (!configComplete()) {
    statusEl.textContent = '✗ Заполни все настройки подключения перед запуском (см. ⚙️ выше).';
    document.getElementById('settingsBlock').open = true;
    return;
  }
  const reportText = document.getElementById('reportText').value;
  if (!reportText.trim()) {
    statusEl.textContent = '✗ Вставь текст отчёта.';
    return;
  }

  clearLog();
  processBtn.disabled = true;
  processBtn.textContent = 'Обрабатываю...';
  statusEl.textContent = '';

  try {
    await loadProducts();
    await processReport(reportText);
    statusEl.textContent = '✓ Обработка завершена. Проверь журнал ниже.';
  } catch (err) {
    log('  [!!!] КРИТИЧЕСКАЯ ОШИБКА: ' + (err && err.message ? err.message : String(err)));
    statusEl.textContent = '✗ Обработка прервана из-за ошибки — см. журнал.';
  } finally {
    processBtn.disabled = false;
    processBtn.textContent = 'Провести ▶';
  }
});

loadConfig();
